# Коробочный стек SOKOL: Postgres + API + Frontend
# Запуск из корня репозитория: см. README / DOCKER.md
name: sokol

services:
  db:
    image: postgres:16-bookworm
    container_name: postgres
    restart: unless-stopped
    # Порты на хост не публикуем: снаружи только UI/API. API ходит на db:5432 в сети sokol.
    # Локальный доступ с хоста: docker-compose.dev-ports.yml
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sokol_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ~/docker-share/postgres-data-sokol:/var/lib/postgresql/data
    networks:
      - sokol
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sokol_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    # Порты на хост не публикуем: API ходит на minio:9000 в сети sokol.
    # Локальный доступ с хоста: docker-compose.dev-ports.yml
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sokol}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - ~/docker-share/minio-data-sokol:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - sokol

  api:
    build:
      context: .
      dockerfile: sokol-backend/docker/app/Dockerfile
    image: sber/sokol-be:master
    container_name: backend
    hostname: backend
    restart: unless-stopped
    env_file:
      - ./sokol-backend/docker/app/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/sokol_db}
      SOKOL_CORS_ORIGINS: ${SOKOL_CORS_ORIGINS:-http://localhost:5180}
      SOKOL_MAX_UPLOAD_MB: ${SOKOL_MAX_UPLOAD_MB:-100}
      SOKOL_DATA_DIR: /app/data
      SOKOL_LOAD_DEMO_DATA: ${SOKOL_LOAD_DEMO_DATA:-0}
      SOKOL_SEED_REPLACE: ${SOKOL_SEED_REPLACE:-0}
      SOKOL_MINIO_ENDPOINT: ${SOKOL_MINIO_ENDPOINT:-minio:9000}
      SOKOL_MINIO_ACCESS_KEY: ${SOKOL_MINIO_ACCESS_KEY:-sokol}
      SOKOL_MINIO_SECRET_KEY: ${SOKOL_MINIO_SECRET_KEY:-change-me}
      SOKOL_MINIO_SECURE: ${SOKOL_MINIO_SECURE:-0}
      SOKOL_JWT_SECRET: ${SOKOL_JWT_SECRET:-sokol-dev-jwt-secret-change-me}
      SOKOL_ADMIN_PASSWORD: ${SOKOL_ADMIN_PASSWORD:-admin}
      SOKOL_DEFAULT_USER_PASSWORD: ${SOKOL_DEFAULT_USER_PASSWORD:-auditor}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8800:8800"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/api/v1/ready', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sokol

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: sber/sokol-backup:master
    container_name: sokol-backup
    hostname: backup
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sokol_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGHOST: db
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sokol}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      SOKOL_MINIO_ENDPOINT: ${SOKOL_MINIO_ENDPOINT:-minio:9000}
      SOKOL_MINIO_SECURE: ${SOKOL_MINIO_SECURE:-0}
      SOKOL_BACKUP_KEEP_DAYS: ${SOKOL_BACKUP_KEEP_DAYS:-14}
      SOKOL_BACKUP_KEEP_MIN: ${SOKOL_BACKUP_KEEP_MIN:-3}
      SOKOL_BACKUP_AT: ${SOKOL_BACKUP_AT:-00:05}
      SOKOL_BACKUP_TZ: ${SOKOL_BACKUP_TZ:-Europe/Moscow}
    volumes:
      - ~/docker-share/sokol-backups:/backups
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "from pathlib import Path; from datetime import datetime, timezone, timedelta; p=Path('/backups/LAST_OK'); raise SystemExit(0 if p.is_file() and datetime.now(timezone.utc)-datetime.fromtimestamp(p.stat().st_mtime, timezone.utc)<timedelta(hours=48) else 1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 26h
    networks:
      - sokol

  ui:
    build:
      context: ./sokol-frontend
      dockerfile: docker/Dockerfile
    image: sber/sokol-fe:master
    container_name: frontend
    hostname: frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5180:5180"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5180/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      # Браузер ходит на опубликованный порт API на хосте
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8800}
      # Vite proxy внутри контейнера — на сервис api, не на 127.0.0.1
      VITE_DEV_API_HOST: api
      VITE_DEV_API_PORT: 8800
    networks:
      - sokol

networks:
  sokol:
    name: sokol
