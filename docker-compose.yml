# Коробочный стек SOKOL: Postgres + API + Frontend
# Запуск из корня репозитория: см. README / DOCKER.md
name: sokol

services:
  db:
    image: postgres:16-bookworm
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sokol_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ~/docker-share/postgres-data-sokol:/var/lib/postgresql/data
    networks:
      - sokol
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sokol_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sokol}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - ~/docker-share/minio-data-sokol:/data
    networks:
      - sokol

  api:
    build:
      context: .
      dockerfile: sokol-backend/docker/app/Dockerfile
    image: sber/sokol-be:master
    container_name: backend
    hostname: backend
    restart: unless-stopped
    env_file:
      - ./sokol-backend/docker/app/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/sokol_db}
      SOKOL_CORS_ORIGINS: ${SOKOL_CORS_ORIGINS:-http://localhost:5180}
      SOKOL_MAX_UPLOAD_MB: ${SOKOL_MAX_UPLOAD_MB:-100}
      SOKOL_DATA_DIR: /app/data
      SOKOL_LOAD_DEMO_DATA: ${SOKOL_LOAD_DEMO_DATA:-1}
      SOKOL_SEED_REPLACE: ${SOKOL_SEED_REPLACE:-0}
      SOKOL_MINIO_ENDPOINT: ${SOKOL_MINIO_ENDPOINT:-minio:9000}
      SOKOL_MINIO_ACCESS_KEY: ${SOKOL_MINIO_ACCESS_KEY:-sokol}
      SOKOL_MINIO_SECRET_KEY: ${SOKOL_MINIO_SECRET_KEY:-change-me}
      SOKOL_MINIO_SECURE: ${SOKOL_MINIO_SECURE:-0}
      SOKOL_JWT_SECRET: ${SOKOL_JWT_SECRET:-sokol-dev-jwt-secret-change-me}
      SOKOL_ADMIN_PASSWORD: ${SOKOL_ADMIN_PASSWORD:-admin}
      SOKOL_DEFAULT_USER_PASSWORD: ${SOKOL_DEFAULT_USER_PASSWORD:-auditor}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8800:8800"
    networks:
      - sokol

  ui:
    build:
      context: ./sokol-frontend
      dockerfile: docker/Dockerfile
    image: sber/sokol-fe:master
    container_name: frontend
    hostname: frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5180:5180"
    environment:
      # Браузер ходит на опубликованный порт API на хосте
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8800}
    networks:
      - sokol

networks:
  sokol:
    name: sokol
