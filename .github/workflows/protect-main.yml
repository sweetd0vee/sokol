# Applies GitHub ruleset "CI merge gate" so red CI cannot be merged to the default branch.
# administration: write is required for the rulesets API (GITHUB_TOKEN, Jan 2024+).
name: Protect default branch

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/protect-main.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  administration: write

jobs:
  upsert-ruleset:
    name: Require CI checks
    runs-on: ubuntu-latest
    steps:
      - name: Upsert CI merge-gate ruleset
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = "CI merge gate";
            const requiredChecks = [
              { context: "Backend (Python 3.12)" },
              { context: "Frontend (Node 22)" },
            ];
            const payload = {
              name,
              target: "branch",
              enforcement: "active",
              conditions: {
                ref_name: {
                  include: ["~DEFAULT_BRANCH"],
                  exclude: [],
                },
              },
              bypass_actors: [],
              rules: [
                { type: "deletion" },
                { type: "non_fast_forward" },
                {
                  type: "pull_request",
                  parameters: {
                    required_approving_review_count: 0,
                    dismiss_stale_reviews_on_push: false,
                    require_code_owner_review: false,
                    require_last_push_approval: false,
                    required_review_thread_resolution: false,
                  },
                },
                {
                  type: "required_status_checks",
                  parameters: {
                    strict_required_status_checks_policy: true,
                    required_status_checks: requiredChecks,
                  },
                },
              ],
            };

            async function upsertRuleset() {
              const { data: rulesets } = await github.request(
                "GET /repos/{owner}/{repo}/rulesets",
                { owner, repo, per_page: 100 }
              );
              const existing = rulesets.find((item) => item.name === name);
              if (existing) {
                await github.request(
                  "PUT /repos/{owner}/{repo}/rulesets/{ruleset_id}",
                  { owner, repo, ruleset_id: existing.id, ...payload }
                );
                core.info(`Updated ruleset ${existing.id}`);
                return;
              }
              await github.request("POST /repos/{owner}/{repo}/rulesets", {
                owner,
                repo,
                ...payload,
              });
              core.info("Created ruleset");
            }

            async function upsertClassicProtection() {
              const branch = context.payload.repository.default_branch;
              await github.request(
                "PUT /repos/{owner}/{repo}/branches/{branch}/protection",
                {
                  owner,
                  repo,
                  branch,
                  required_status_checks: {
                    strict: true,
                    checks: requiredChecks,
                  },
                  enforce_admins: true,
                  required_pull_request_reviews: {
                    required_approving_review_count: 0,
                    dismiss_stale_reviews: false,
                    require_code_owner_reviews: false,
                    require_last_push_approval: false,
                  },
                  restrictions: null,
                  allow_force_pushes: false,
                  allow_deletions: false,
                }
              );
              core.info(`Updated classic branch protection on ${branch}`);
            }

            try {
              await upsertRuleset();
            } catch (err) {
              core.warning(
                `Ruleset API failed (${err.message}); trying classic branch protection`
              );
              try {
                await upsertClassicProtection();
              } catch (classicErr) {
                core.setFailed(
                  `Could not enable required CI checks. Apply docs/CI.md manually. Ruleset: ${err.message}. Classic: ${classicErr.message}`
                );
              }
            }
