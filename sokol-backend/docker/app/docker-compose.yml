name: sokol

services:
  db:
    image: postgres:16-bookworm
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ~/docker-share/postgres-data-sokol:/var/lib/postgresql/data
    networks:
      - sokol
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sokol_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
    image: sber/sokol-be:master
    container_name: backend
    hostname: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SOKOL_CORS_ORIGINS: ${SOKOL_CORS_ORIGINS:-http://localhost:5180}
      SOKOL_MAX_UPLOAD_MB: ${SOKOL_MAX_UPLOAD_MB:-100}
      SOKOL_OLLAMA_URL: ${SOKOL_OLLAMA_URL:-http://ollama:11434}
      SOKOL_OLLAMA_MODEL: ${SOKOL_OLLAMA_MODEL:-qwen3.5:35b}
      SOKOL_OLLAMA_TIMEOUT_S: ${SOKOL_OLLAMA_TIMEOUT_S:-600}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8800:8800"
    networks:
      - sokol

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ~/docker-share/ollama:/root/.ollama
    networks:
      - sokol

  minio:
    profiles: ["extras"]
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    command: server --console-address ":9001" /data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ~/docker-share/minio:/data
    networks:
      - sokol
    restart: unless-stopped

  mail:
    profiles: ["extras"]
    image: jcalonso/mailhog:v1.0.1
    container_name: mail
    hostname: mail
    environment:
      MAILHOG_USERNAME: ${MAIL_USERNAME}
      MAILHOG_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - 25:${MAIL_PORT}
      - 8025:8025
    networks:
      - sokol
    restart: unless-stopped

networks:
  sokol:
    name: sokol
