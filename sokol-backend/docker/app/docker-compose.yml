name: sokol

services:
  db:
    image: postgres:16-bookworm
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ~/docker-share/postgres-data-sokol:/var/lib/postgresql/data
    networks:
      - sokol
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sokol_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../..
      dockerfile: sokol-backend/docker/app/Dockerfile
    image: sber/sokol-be:master
    container_name: backend
    hostname: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SOKOL_ENV: ${SOKOL_ENV:-development}
      SOKOL_CORS_ORIGINS: ${SOKOL_CORS_ORIGINS:-http://localhost:5180}
      SOKOL_MAX_UPLOAD_MB: ${SOKOL_MAX_UPLOAD_MB:-100}
      SOKOL_DATA_DIR: /app/data
      SOKOL_LOAD_DEMO_DATA: ${SOKOL_LOAD_DEMO_DATA:-1}
      SOKOL_SEED_REPLACE: ${SOKOL_SEED_REPLACE:-0}
      SOKOL_MINIO_ENDPOINT: ${SOKOL_MINIO_ENDPOINT:-minio:9000}
      SOKOL_MINIO_ACCESS_KEY: ${SOKOL_MINIO_ACCESS_KEY:-sokol}
      SOKOL_MINIO_SECRET_KEY: ${SOKOL_MINIO_SECRET_KEY:-change-me}
      SOKOL_MINIO_SECURE: ${SOKOL_MINIO_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8800:8800"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/api/v1/ready', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sokol

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: minio
    command: server --console-address ":9001" /data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sokol}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - ~/docker-share/minio-data-sokol:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - sokol
    restart: unless-stopped

  backup:
    build:
      context: ../../..
      dockerfile: docker/backup/Dockerfile
    image: sber/sokol-backup:master
    container_name: sokol-backup
    hostname: backup
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sokol_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGHOST: db
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sokol}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      SOKOL_MINIO_ENDPOINT: ${SOKOL_MINIO_ENDPOINT:-minio:9000}
      SOKOL_MINIO_SECURE: ${SOKOL_MINIO_SECURE:-0}
      SOKOL_BACKUP_KEEP_DAYS: ${SOKOL_BACKUP_KEEP_DAYS:-14}
      SOKOL_BACKUP_KEEP_MIN: ${SOKOL_BACKUP_KEEP_MIN:-3}
      SOKOL_BACKUP_AT: ${SOKOL_BACKUP_AT:-00:05}
      SOKOL_BACKUP_TZ: ${SOKOL_BACKUP_TZ:-Europe/Moscow}
    volumes:
      - ~/docker-share/sokol-backups:/backups
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "from pathlib import Path; from datetime import datetime, timezone, timedelta; p=Path('/backups/LAST_OK'); raise SystemExit(0 if p.is_file() and datetime.now(timezone.utc)-datetime.fromtimestamp(p.stat().st_mtime, timezone.utc)<timedelta(hours=48) else 1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 26h
    networks:
      - sokol

  mail:
    profiles: ["extras"]
    image: jcalonso/mailhog:v1.0.1
    container_name: mail
    hostname: mail
    environment:
      MAILHOG_USERNAME: ${MAIL_USERNAME}
      MAILHOG_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - 25:${MAIL_PORT}
      - 8025:8025
    networks:
      - sokol
    restart: unless-stopped

networks:
  sokol:
    name: sokol
